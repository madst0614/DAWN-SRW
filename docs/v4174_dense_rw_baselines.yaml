protocols:
  two_layer_backward_gate:
    benchmark_args:
      - --fast
      - --backward-profile
      - --detailed-profile-layers
      - "2"
      - --no-xla-dump
    warmup_steps: 0
    train_measure_steps: 0
    detailed_profile_steps: 1
    primary_metric: "sum(qkv_bundle_srw_fwd_bwd.total_seconds, rst_bundle_srw_fwd_bwd.total_seconds)"
    backward_only_metric: "primary_metric - sum(qkv_bundle_srw.total_seconds, rst_bundle_srw.total_seconds)"
  five_step_full_train:
    benchmark_args:
      - --steps
      - "5"
      - --warmup-steps
      - "3"
      - --forward-profile-steps
      - "0"
      - --module-profile-steps
      - "0"
      - --no-xla-dump
    warmup_steps: 3
    measure_steps: 5
    primary_metric: mean_step_seconds

