schema_version: 1
registry_id: v4174-400m-dense-rw
updated_kst: "2026-07-27"
active_generation: g5

canonical_source:
  branch: codex/v4167-poc
  audited_commit: ae12416b40607ef8dd21fe79a64d86b4335e18b3
  baseline_source_branch: codex/v4167-poc
  experimental_branches_are_candidate_only: true
  accepted_changes_require_sync_to_canonical_branch: true
  historical_measurements_keep_actual_branch_and_commit: true
  current_source_requires_new_generation: false
  current_source_rebaseline_reason: null

purpose:
  question: "Can a candidate make the same canonical dense v4174 computation cheaper?"
  default_control: "Reuse the active generation's stored measurements."
  default_measurement: "Run the candidate only."

policy:
  integration:
    canonical_branch: codex/v4167-poc
    canonical_baseline_source_branch: codex/v4167-poc
    completion_rule: "An accepted candidate becomes canonical only after its final code, schema, optimization, and baseline decision are synchronized to codex/v4167-poc and pushed."
    historical_identity_rule: "Keep the branch and commit actually measured; do not rewrite historical evidence after synchronization."
  reuse:
    rerun_control_by_default: false
    compare_candidate_to: active_generation
    requirement:
      - "The active generation fingerprint and all comparison invariants still match."
      - "The candidate changes only the implementation under test."
      - "The candidate uses the same protocol, real data, initialization seed, shapes, precision, mesh, and runtime release line."
  candidate_protocol:
    first: two_layer_backward_gate
    continue_to_full_step_only_if_gate_passes: true
    second: five_step_full_train
  acceptance:
    two_layer_combined_qkv_rst_fwd_bwd_improvement_percent_min: 10.0
    five_step_mean_improvement_percent_min: 2.0
    compile_regression_percent_max: 5.0
    runtime_peak_hbm_regression_gib_max: 0.05
    fail_on_oom_nan_inf_or_process_loss: true
    always_report_signed_compile_and_hbm_deltas: true
  promotion:
    action: "Promote the accepted candidate and its already measured gate/full-step results as a new generation."
    rerun_promoted_candidate_as_control: false
    requirement: "Both canonical protocols must have completed under one matching fingerprint before promotion."
  invalidation:
    create_a_new_baseline_generation_once_if:
      - "The accepted model structure, parameter roots/count/shapes, layer count, D, R, M, K, operator counts, or chunk semantics changes."
      - "The forward topology, exact-overflow behavior, collective placement, precision boundary, or composition mode changes."
      - "The performance-relevant config file or initialization seed changes."
      - "The TPU accelerator type, global device count, mesh, batch size, sequence length, or real-data source changes."
      - "The Python, JAX, Flax, Orbax, or libtpu release line changes."
      - "The benchmark script, profiler semantics, warmup/measurement counts, or launcher execution semantics changes."
      - "The accepted source changed without completing both canonical protocols before acceptance."
    do_not_invalidate_for:
      - "A candidate-only source edit under test."
      - "Notebook, comments, logging text, or other non-performance metadata."
      - "Promotion of a fully measured accepted candidate; use its existing measurements."
    near_threshold_or_suspected_noise:
      - "Repeat the candidate first."
      - "Rerun the control only after a fingerprint mismatch or concrete drift evidence."
  recording:
    canonical_notebook: EXPERIMENT.md
    canonical_registry: docs/v4174_dense_rw_baselines.yaml
    raw_logs_in_git: false
    required_identity:
      - branch
      - commit
      - model_git_blob
      - config_git_blob
      - config_sha256
      - benchmark_git_blob
      - launcher_git_blob
      - setup_git_blob
      - checkpoint
      - accelerator
      - device_count
      - mesh
      - batch_size
      - sequence_length
      - data_source
      - Python
      - JAX
      - Flax
      - Orbax
      - dirty_worktree_state

