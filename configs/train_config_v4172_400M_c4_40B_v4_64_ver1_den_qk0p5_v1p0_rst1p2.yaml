seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.2
  operator_key_mode: generalized_bilinear_rw
  operator_query_mode: direct_state_projection
  vocab_size: 30522
  d_model: 2304
  n_layers: 18
  n_heads: 36
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true

  d_route: 256
  gate_den_power: 1.0
  gate_den_power_qk: 0.5
  gate_den_power_v: 1.0
  gate_den_power_rst: 1.2
  srw_composition_mode: linear_angular

  n_qk: 4600
  n_v: 14500
  n_rst: 29300

  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_target_qk_frac: 0.05
  tau_init_target_v_frac: 0.03
  tau_init_target_rst_frac: 0.01

training:
  batch_size: 1024
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4

  lr: 0.0003
  tau_lr_mult: 0.001
  warmup_ratio: 0.08
  weight_decay: 0.1

  eval_effective_prune_enabled: false
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001

  checkpoint_interval: 500
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4172_400M_c4_40B_v4_64_ver1_den_qk0p5_v1p0_rst1p2
