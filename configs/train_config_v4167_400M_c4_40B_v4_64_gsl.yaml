seed: 1
data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.6.7
  vocab_size: 30522
  d_model: 2304
  n_layers: 18
  n_heads: 36
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true
  d_route: 256
  fixed_tau: true
  layers_per_stage: 3
  router_scope: local
  n_qk: 2402
  n_v: 7480
  n_rst: 20088
  n_qk_global: 230
  n_qk_stage: 80
  n_qk_local: 94
  n_v_global: 760
  n_v_stage: 250
  n_v_local: 290
  n_rst_global: 2004
  n_rst_stage: 668
  n_rst_local: 782
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_mode: quantile_frac
  tau_init_target_qk_frac: 0.12
  tau_init_target_v_frac: 0.08
  tau_init_target_rst_frac: 0.025

training:
  batch_size: 1024
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1
  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 2
  lr: 0.0003
  warmup_ratio: 0.08
  weight_decay: 0.1
  tau_lr_mult: 0.0
  tau_grad_clip: 2.0
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  op_key_lr_mult: 1.0
  op_key_grad_clip: 2.0

  diversity_weight: 0.0
  load_balance_weight: 0.0
  dead_penalty_weight: 0.0
  dead_exposure_target: 0.0

  selection_calibration:
    enabled: true

    calibration_tokens: 4194304
    calibration_max_batches: 64
    histogram_bins: 16384
    score_min: -1.0
    score_max: 1.0
    candidate_eps: 1.0e-3

    active_target:
      qk: 0.12
      v: 0.08
      rst: 0.025

    candidate_target_start:
      qk: 0.18
      v: 0.12
      rst: 0.040

    candidate_target_final:
      qk: 0.12
      v: 0.08
      rst: 0.025

    B_floor:
      qk: 0.001
      v: 0.001
      rst: 0.001

    annealing:
      unit: tokens
      shrink_start_tokens: 1000000000
      shrink_end_tokens: 8000000000

  soft_gate_effective_active_eps: 1.0e-06
  admission_den_power: 0.5
  admission_den_grad_scale: 1.0

  soft_gate_boundary_power_start: 3.0
  soft_gate_boundary_power_mid: 4.0
  soft_gate_boundary_power_final: 4.0
  soft_gate_boundary_power_start_frac: 0.0
  soft_gate_boundary_power_mid_frac: 0.20
  soft_gate_boundary_power_final_frac: 0.40

  eval_effective_prune_enabled: true
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001
  checkpoint_interval: 200
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4167_400M_c4_40B_v2
