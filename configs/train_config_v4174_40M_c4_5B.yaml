# DAWN-SRW v4.1.7.4 40M M=8 validation configuration.
#
# Parameter comparison:
#   Transformer baseline D=432: 40,343,616
#   This v4174 configuration:   40,343,136
#   Difference:                       -480 (-0.0012%)
#
# Active targets at initialization:
#   Q   ~= 200 operators/token
#   K   ~= 200 operators/token
#   V   ~= 600 operators/token
#   RST ~= 1,200 operators/token
#
# M=8 is intended as a fast structural/training POC.
# Current bundle4 production path requires M=24, so this config uses
# dense_all_space without requiring a model-code change.

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 5000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.4

  vocab_size: 30522
  d_model: 432
  d_route: 128
  n_layers: 12
  n_heads: 6
  max_seq_len: 512

  dropout: 0.0
  gradient_checkpointing: true

  # Operation-space topology.
  n_operation_spaces: 8
  operation_space_top_k: 1

  # Config-only M=8 path.
  # Semantic routing remains hard top-2, but all eight spaces are
  # physically evaluated before routing-weighted writeback.
  operation_space_execution_mode: dense_all_space

  # Parameter-matched operator banks.
  #
  # Per operation space:
  #   Q   =   558
  #   K   =   558
  #   V   = 3,474
  #   RST = 6,997
  #
  # Top-2 visible operators:
  #   Q   = 1,116
  #   K   = 1,116
  #   V   = 6,948
  #   RST = 13,994
  n_q: 4464
  n_k: 4464
  n_v: 27792
  n_rst: 55976

  # Data-calibrated direct-read tau initialization.
  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95

  # Expected initial active counts:
  #
  # Q:   1,116 * 0.1792  ~= 200
  # K:   1,116 * 0.1792  ~= 200
  # V:   6,948 * 0.08636 ~= 600
  # RST: 13,994 * 0.08575 ~= 1,200
  tau_init_target_qk_frac: 0.1792
  tau_init_target_v_frac: 0.08636
  tau_init_target_rst_frac: 0.08575

  # Current linear-angular composition semantics.
  srw_composition_mode: linear_angular

  admission_den_power: 1.0
  admission_den_power_qk: 0.5
  admission_den_power_v: 1.0
  admission_den_power_rst: 1.2

training:
  # TPU v4-4.
  mesh_data: 4
  mesh_model: 1

  batch_size: 128
  gradient_accumulation_steps: 1
  num_epochs: 1

  # Operator chunking.
  #
  # Per-space chunk widths:
  #   Q/K: 558
  #   V:   ceil(3,474 / 2) = 1,737
  #   RST: ceil(6,997 / 8) = 875
  n_chunks_q: 1
  n_chunks_k: 1
  n_chunks_v: 2
  n_chunks_rst: 8

  # Established 40M optimization schedule.
  lr: 0.00065
  tau_lr_mult: 0.001
  warmup_ratio: 0.06
  weight_decay: 0.1

  checkpoint_interval: 500
  val_interval: 500
  log_interval: 100

  # Keep expensive diagnostics outside the training hot path.
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4174_40M_c4_5B_K_1