# DAWN-SRW v4.1.7.4 - 8 operation spaces, top-2, parameter matched
#
# The filename and serialized config aliases retain "address" for compatibility
# with the active native-v4174 run. Architecturally, M denotes operation spaces
# and the shared key table contains one learned key per operation space.
#
# Parameter match (symbolic counter; initialized-tree equality is unit tested):
#   baseline v4173 params:       40,343,044
#   v4174 operation-space params: 40,343,584
#   absolute difference:                540
#   relative difference:          0.001339%
#   baseline qk/v/rst counts:  9,748 / 30,730 / 62,094
#   new qk/v/rst totals:       8,776 / 27,664 / 55,896
#   per-space counts:          1,097 /  3,458 /  6,987
#   n_operation_addresses: 8
#   operation_address_top_k: 2
#
# Explicit per-space tau targets preserve the approximate selected active
# count of the single-space baseline. With M=8 and K=2:
#   K * (N/M) * target_multi ~= N * target_single
#   Q/K: 2 * (N/8) * 0.20 ~= N * 0.05
#   V:   2 * (N/8) * 0.12 ~= N * 0.03
#   RST: 2 * (N/8) * 0.04 ~= N * 0.01
# Q and K apply the same qk target independently to their own score tables.

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 5000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.4
  operator_key_mode: generalized_bilinear_rw
  operator_query_mode: direct_state_projection

  vocab_size: 30522
  d_model: 384
  n_layers: 12
  n_heads: 6
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true

  d_route: 128
  n_operation_addresses: 8
  operation_address_top_k: 2

  admission_den_power: 1.0
  admission_den_power_qk: 0.5
  admission_den_power_v: 1.0
  admission_den_power_rst: 1.2
  srw_composition_mode: linear_angular

  n_qk: 8776
  n_v: 27664
  n_rst: 55896

  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_target_qk_frac: 0.20
  tau_init_target_v_frac: 0.12
  tau_init_target_rst_frac: 0.04

training:
  mesh_model: 1
  mesh_data: 4
  batch_size: 128
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_qk: 1
  n_chunks_v: 2
  n_chunks_rst: 8

  lr: 0.00065
  tau_lr_mult: 0.001
  weight_decay: 0.1
  warmup_ratio: 0.06

  eval_effective_prune_enabled: false
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001

  checkpoint_interval: 500
  val_interval: 500
  log_interval: 100
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

  production_diagnostic_parity_atol: 1.0e-5
  production_diagnostic_parity_rtol: 1.0e-5

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4174_40M_c4_5B_address8_top2_parammatch
log_dir: gs://dawn-tpu-data-c4/logs/dawn_srw_v4174_40M_c4_5B_address8_top2_parammatch
