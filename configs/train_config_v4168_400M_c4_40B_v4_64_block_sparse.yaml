seed: 1
data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.6.8
  vocab_size: 30522
  d_model: 2304
  n_layers: 18
  n_heads: 36
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true
  d_route: 256
  n_qk: 3798
  n_v: 11824
  n_rst: 31756

training:
  batch_size: 1024
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1
  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4
  lr: 0.0003
  warmup_ratio: 0.08
  weight_decay: 0.1
  tau_lr_mult: 0.0
  tau_grad_clip: 2.0
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  op_key_lr_mult: 1.0
  op_key_grad_clip: 2.0

  diversity_weight: 0.0
  load_balance_weight: 0.0
  dead_penalty_weight: 0.0
  dead_exposure_target: 0.0

  admission_den_power: 0.5

  operation_space:
    enabled: true
    version: region_block_atlas_v1
    tile_size: 128

    pools:
      qk:
        routing_mode: factorized_lane_mean
        execution_mode: dense_masked
        lanes: 8
        k_exec: 4

      v:
        routing_mode: factorized_lane_mean
        execution_mode: dense_masked
        lanes: 8
        k_exec: 5

      rst:
        routing_mode: region_block
        execution_mode: region_block_pallas
        num_regions: 32
        blocks_per_region: 2
        operators_per_block: 512
        visible_regions_start: 8
        visible_regions_mid: 6
        visible_regions_final: 4
        visible_blocks_per_region: 1
        candidate_region_count: 8
        region_score_pooling: smoothmax
        region_score_temperature: 0.25
        region_capacity_factor: 1.25
        block_capacity_factor: 1.25
        block_mixing_enabled: false

    repack:
      enabled: false
      start_step: 1000
      interval_steps: 100
      max_swaps:
        rst: 256
  checkpoint_interval: 200
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4168_400M_c4_40B_v4_64_region_block_atlas
