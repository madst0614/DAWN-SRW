seed: 1
data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.6.8
  vocab_size: 30522
  d_model: 2304
  n_layers: 18
  n_heads: 36
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true
  d_route: 256
  n_qk: 3798
  n_v: 11824
  n_rst: 31756

training:
  batch_size: 1024
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1
  ce_token_chunk_size: 32768
  train_compute_accuracy: true
  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4
  lr: 0.0003
  warmup_ratio: 0.08
  weight_decay: 0.1
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  op_key_lr_mult: 1.0
  op_key_grad_clip: 2.0

  opspace_gate_den_power: 0.5

  operation_space_load_smoothing:
    enabled: true
    mode: capacity
    load_temperature: 0.10
    space_temperature: 0.12
    alpha: 1.25
    warmup_tokens: 0
    peak_tokens: 1000000000
    final_weight_frac: 1.0

    qk:
      region_weight: 3.0e-4
      block_weight: 0.0

    v:
      region_weight: 3.0e-4
      block_weight: 0.0

    rst:
      region_weight: 3.0e-4
      block_weight: 0.0

  operation_space:
    enabled: true

    pools:
      qk:
        execution_backend: dense
        num_regions: 8
        visible_regions: 1
        blocks_per_region: 5
        operators_per_block: 96
        visible_blocks_per_region: 3
        region_score_pooling: smoothmax
        region_score_temperature: 0.25

      v:
        execution_backend: dense
        num_regions: 8
        visible_regions: 1
        blocks_per_region: 6
        operators_per_block: 256
        visible_blocks_per_region: 6
        region_score_pooling: smoothmax
        region_score_temperature: 0.25

      rst:
        execution_backend: sparse_region_block
        num_regions: 8
        visible_regions: 1
        blocks_per_region: 8
        operators_per_block: 512
        visible_blocks_per_region: 7
        region_score_pooling: smoothmax
        region_score_temperature: 0.25
        region_capacity_factor: 1.5
        spill_capacity: 8192
  checkpoint_interval: 200
  val_interval: 200
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4168_400M_c4_40B_region_block
