# Vanilla Transformer Baseline - TPU Training Config, 1p3B Scale, v4-128 Pod
# Parameter-matched: d_model=2048, n_layers=24, d_ff=8192 (~1.272B params, tied LM head)
# Training hyperparams matched to DAWN/SRW 1p3B config for fair comparison
# Checkpoint compatible with v4-32 config for seamless migration

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 80000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data
  evict_train_shard_cache: true

model:
  model_version: "baseline"
  vocab_size: 30522
  d_model: 2048
  d_ff: 8192
  n_layers: 24
  n_heads: 16
  max_seq_len: 512
  dropout: 0.0
  gradient_checkpointing: true

training:
  mesh_model: 1
  mesh_data: 64
  batch_size: 2048
  gradient_accumulation_steps: 1
  num_epochs: 1
  lr: 0.0002
  weight_decay: 0.1
  warmup_ratio: 0.06
  orthogonality_weight: 0.0
  diversity_weight: 0.0
  load_balance_weight: 0.0
  entropy_weight: 0.0
  process_norm_weight: 0.0
  checkpoint_interval: 200
  val_interval: 200

use_amp: true
checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/baseline_1p3B_c4_80B
log_dir: gs://dawn-tpu-data-c4/logs/baseline_1p3B_c4_80B
