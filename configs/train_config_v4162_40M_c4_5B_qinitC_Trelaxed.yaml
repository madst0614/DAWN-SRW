seed: 1
data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 5000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data
model:
  model_version: spatial-r1-v4.1.6.2
  vocab_size: 30522
  d_model: 384
  n_layers: 12
  n_heads: 6
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true
  d_route: 128
  d_select: 64
  n_qk: 1480
  n_v: 7330
  n_rst: 20560
  tau_init_min: -0.95
  tau_init_max: 0.95

  # One-time local tau initialization from the first training batch
  tau_init_mode: quantile_frac
  tau_init_target_qk_frac: 0.15
  tau_init_target_v_frac: 0.06
  tau_init_target_rst_frac: 0.05
training:
  batch_size: 128
  mesh_model: 1
  mesh_data: 4
  gradient_accumulation_steps: 1
  num_epochs: 1
  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4
  lr: 0.00065
  warmup_ratio: 0.06
  weight_decay: 0.1
  pool_weight_decay: 0.0
  tau_lr_mult: 1.0
  tau_grad_clip: 2.0
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  route_emb_lr_mult: 1.0
  route_emb_grad_clip: 2.0

  dead_penalty_weight: 0.0
  dead_exposure_target: 0.0

  rpe_enabled: false
  rpe_start_frac: 0.2
  rpe_full_frac: 0.45
  rpe_schedule: linear
  exploration_weight: 0.0
  exploration_weight_qk: 0.0
  exploration_weight_v: 0.0
  exploration_weight_rst: 0.0
  exploration_asymmetry: 1.0
  exploration_lower_bound: 0.0
  exploration_upper_bound: 0.95
  exploration_bound_eps: 0.001
  exploration_dev_mode: bounded_z
  exploration_ce_clip_std: 2.0
  exploration_z_clip: 2.0
  exploration_z_tanh: true

  soft_gate_enabled: true
  # Soft gate temperature: Gompertz differentiation schedule
  soft_gate_t_start: 1.5
  soft_gate_t_final: 0.001
  soft_gate_t_hold_frac: 0.0
  soft_gate_t_anneal_end_frac: 0.90
  soft_gate_t_schedule: log_gompertz
  soft_gate_t_gompertz_center: 0.20
  soft_gate_t_gompertz_steepness: 8.0

  # Pool-specific soft gate temperature schedules
  soft_gate_t_pool_specific: true
  soft_gate_effective_active_eps: 1.0e-06

  soft_gate_t_qk_start: 0.8
  soft_gate_t_qk_final: 0.001
  soft_gate_t_qk_hold_frac: 0.0
  soft_gate_t_qk_anneal_end_frac: 0.80
  soft_gate_t_qk_schedule: log_gompertz
  soft_gate_t_qk_gompertz_center: 0.12
  soft_gate_t_qk_gompertz_steepness: 10.0

  soft_gate_t_v_start: 0.50
  soft_gate_t_v_final: 0.001
  soft_gate_t_v_hold_frac: 0.0
  soft_gate_t_v_anneal_end_frac: 0.75
  soft_gate_t_v_schedule: log_gompertz
  soft_gate_t_v_gompertz_center: 0.10
  soft_gate_t_v_gompertz_steepness: 10.0

  soft_gate_t_rst_start: 0.55
  soft_gate_t_rst_final: 0.001
  soft_gate_t_rst_hold_frac: 0.0
  soft_gate_t_rst_anneal_end_frac: 0.75
  soft_gate_t_rst_schedule: log_gompertz
  soft_gate_t_rst_gompertz_center: 0.10
  soft_gate_t_rst_gompertz_steepness: 10.0


  regular_diagnostics_level: compact
  regular_current_eps:
  - 0.1
  - 0.01
  - 0.001
  regular_projected_eps:
  - 1.0e-06
  regular_mass_enabled: false

  # Tau CE-gradient handoff: log-space influence decay
  tau_ce_grad_scale_start: 1.0
  tau_ce_grad_scale_final: 0.01
  tau_ce_grad_scale_hold_frac: 0.02
  tau_ce_grad_scale_anneal_end_frac: 0.25
  tau_ce_grad_scale_schedule: log_linear

  # Pool-specific tau CE-gradient handoff
  tau_ce_grad_scale_pool_specific: true

  tau_ce_grad_scale_qk_start: 1.0
  tau_ce_grad_scale_qk_final: 0.005
  tau_ce_grad_scale_qk_hold_frac: 0.005
  tau_ce_grad_scale_qk_anneal_end_frac: 0.15
  tau_ce_grad_scale_qk_schedule: log_linear

  tau_ce_grad_scale_v_start: 1.0
  tau_ce_grad_scale_v_final: 0.0001
  tau_ce_grad_scale_v_hold_frac: 0.0
  tau_ce_grad_scale_v_anneal_end_frac: 0.06
  tau_ce_grad_scale_v_schedule: log_linear

  tau_ce_grad_scale_rst_start: 1.0
  tau_ce_grad_scale_rst_final: 0.0001
  tau_ce_grad_scale_rst_hold_frac: 0.0
  tau_ce_grad_scale_rst_anneal_end_frac: 0.06
  tau_ce_grad_scale_rst_schedule: log_linear

  intensity_beta: 0.5

  eval_effective_prune_enabled: true
  eval_effective_prune_eps_list:
  - 1.0e-06
  - 1.0e-05
  - 0.0001
  checkpoint_interval: 1000
  val_interval: 500
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10
  stop_on_collapse: false
  crash_snapshot: false
  crash_snapshot_enabled: false
  spike_event_logger: false
checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/v4162_40M_qinitC_Trelaxed_q15_v06_rst05_Tv050_tauV0001
