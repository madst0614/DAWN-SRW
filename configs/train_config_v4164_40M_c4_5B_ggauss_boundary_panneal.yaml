seed: 1
data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 5000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data
model:
  model_version: spatial-r1-v4.1.6.4
  vocab_size: 30522
  d_model: 384
  n_layers: 12
  n_heads: 6
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true
  d_route: 128
  n_qk: 1480
  n_v: 7330
  n_rst: 20560
  tau_init_min: -0.95
  tau_init_max: 0.95

  # One-time local tau initialization from the first training batch
  tau_init_mode: quantile_frac
  tau_init_target_qk_frac: 0.10
  tau_init_target_v_frac: 0.04
  tau_init_target_rst_frac: 0.02
training:
  batch_size: 128
  mesh_model: 1
  mesh_data: 4
  gradient_accumulation_steps: 1
  num_epochs: 1
  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4
  lr: 0.00065
  warmup_ratio: 0.06
  weight_decay: 0.1
  pool_weight_decay: 0.0
  tau_lr_mult: 0.0
  tau_grad_clip: 2.0
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  route_emb_lr_mult: 1.0
  route_emb_grad_clip: 2.0

  diversity_weight: 0.0
  load_balance_weight: 0.0
  dead_penalty_weight: 0.0
  dead_exposure_target: 0.0

  rpe_enabled: false
  rpe_start_frac: 0.2
  rpe_full_frac: 0.45
  rpe_schedule: linear
  exploration_weight: 0.0
  exploration_weight_qk: 0.0
  exploration_weight_v: 0.0
  exploration_weight_rst: 0.0
  exploration_asymmetry: 1.0
  exploration_lower_bound: 0.0
  exploration_upper_bound: 0.95
  exploration_bound_eps: 0.001
  exploration_dev_mode: bounded_z
  exploration_ce_clip_std: 2.0
  exploration_z_clip: 2.0
  exploration_z_tanh: true

  soft_gate_enabled: true
  soft_gate_t_pool_specific: true
  soft_gate_effective_active_eps: 1.0e-06
  # Admission-based divisive normalization / inhibition
  # admission_den = max(sum(admission), 1) ** admission_den_power
  # admission_den_grad_scale controls only the backward denominator branch:
  #   0.0 = detached admission_den, 1.0 = full live admission_den.
  admission_den_power: 0.5
  admission_den_grad_scale: 1.0
  soft_gate_boundary_power_enabled: true
  soft_gate_boundary_power_start: 3.0
  soft_gate_boundary_power_mid: 3.15
  soft_gate_boundary_power_final: 4.0
  soft_gate_boundary_power_mid_frac: 0.800
  soft_gate_boundary_power_final_frac: 0.950

  # Developmental Band Annealing
  # Phase A: no-sorting / direct small target band
  # Phase B: stable small-band formation
  # Phase C: formation band
  # Phase D/E: micro-sharpening -> final sparse consolidation

  soft_gate_t_qk_schedule: developmental_band
  soft_gate_t_qk_sort: 0.035
  soft_gate_t_qk_band: 0.035
  soft_gate_t_qk_mid: 0.030
  soft_gate_t_qk_late: 0.001
  soft_gate_t_qk_final: 0.001
  soft_gate_t_qk_sort_end_frac: 0.0
  soft_gate_t_qk_band_reach_frac: 0.001
  soft_gate_t_qk_formation_end_frac: 0.800
  soft_gate_t_qk_sharpen_end_frac: 0.950
  soft_gate_t_qk_formation_power: 2.0
  soft_gate_t_qk_sharpen_power: 1.0

  soft_gate_t_v_schedule: developmental_band
  soft_gate_t_v_sort: 0.018
  soft_gate_t_v_band: 0.018
  soft_gate_t_v_mid: 0.0155
  soft_gate_t_v_late: 0.001
  soft_gate_t_v_final: 0.001
  soft_gate_t_v_sort_end_frac: 0.0
  soft_gate_t_v_band_reach_frac: 0.001
  soft_gate_t_v_formation_end_frac: 0.800
  soft_gate_t_v_sharpen_end_frac: 0.950
  soft_gate_t_v_formation_power: 2.0
  soft_gate_t_v_sharpen_power: 1.0

  soft_gate_t_rst_schedule: developmental_band
  soft_gate_t_rst_sort: 0.011
  soft_gate_t_rst_band: 0.011
  soft_gate_t_rst_mid: 0.0095
  soft_gate_t_rst_late: 0.001
  soft_gate_t_rst_final: 0.001
  soft_gate_t_rst_sort_end_frac: 0.0
  soft_gate_t_rst_band_reach_frac: 0.001
  soft_gate_t_rst_formation_end_frac: 0.800
  soft_gate_t_rst_sharpen_end_frac: 0.950
  soft_gate_t_rst_formation_power: 2.0
  soft_gate_t_rst_sharpen_power: 1.0

  regular_diagnostics_level: compact
  regular_current_eps:
  - 0.0001
  - 0.001
  - 0.01
  - 0.1
  regular_projected_eps:
  - 1.0e-06
  regular_mass_enabled: false
  regular_sparsity_enabled: true

  eval_effective_prune_enabled: true
  eval_effective_prune_eps_list:
  - 1.0e-06
  - 1.0e-05
  - 0.0001
  checkpoint_interval: 1000
  val_interval: 500
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10
  stop_on_collapse: false
  crash_snapshot: false
  crash_snapshot_enabled: false
  spike_event_logger: false
checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4164_40M_c4_5B_ggauss_boundary_panneal
