downstream_suite:
  name: baseline_400M
  init_from: gs://dawn-tpu-data-c4/checkpoints/baseline_400M_c4_40B_v4_64/run_vbaseline-JAX_20260713_194029_3201
  output_root: gs://dawn-tpu-data-c4/downstream_runs/baseline_400M
  tasks:
    - sst2
    - rte
    - wic
    - boolq
    - mnli

  tokenizer: bert-base-uncased

  downstream:
    source: hf
    max_seq_len: 512
    add_eos: false

  training:
    batch_size: 64
    eval_batch_size: 64
    lr: 2.0e-05
    weight_decay: 0.01
    warmup_ratio: 0.06
    min_lr_ratio: 0.1
    max_grad_norm: 1.0
    log_interval: 20
    mesh_model: 2
    mesh_data: 0
    ce_token_chunk_size: 8192
    train_compute_accuracy: true
    initialize_jax_distributed: true
