# DAWN-SRW v4.1.7.4 canonical explicit-read operation spaces.
#
# Parameter comparison against the previous v4174 operator-field config:
#   previous v4174 actual: 216,204,292
#   direct-read v4174 actual: 214,502,404
#   absolute / relative difference: -1,701,888 / -0.787%
#
# Q and K split the previous shared-QK row budget explicitly.  Every pool
# count is divisible by M * mesh_model = 16:
#   totals:    Q=6,160  K=6,160  V=38,832  RST=78,496
#   per-space: Q=770    K=770    V=4,854   RST=9,812
#
# Q and K use independent direct-read score tables and independent tau maps.

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.4

  vocab_size: 30522
  d_model: 2048
  d_route: 256
  n_layers: 18
  n_heads: 32
  max_seq_len: 512

  dropout: 0.0
  gradient_checkpointing: true

  n_operation_spaces: 8
  operation_space_top_k: 2

  n_q: 6160
  n_k: 6160
  n_v: 38832
  n_rst: 78496

  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95
  # f_r = A_ref * M / (K * N_r); therefore K*(N_r/M)*f_r = A_ref.
  tau_init_target_qk_frac: 0.2694805194805195
  tau_init_target_v_frac: 0.08084054388133498
  tau_init_target_rst_frac: 0.026938442723196086

  srw_composition_mode: linear_angular
  admission_den_power: 1.0
  admission_den_power_qk: 0.5
  admission_den_power_v: 1.0
  admission_den_power_rst: 1.2

training:
  mesh_data: 16
  mesh_model: 2

  batch_size: 1024
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_q: 1
  n_chunks_k: 1
  n_chunks_v: 2
  n_chunks_rst: 8

  lr: 3.0e-4
  tau_lr_mult: 0.001
  warmup_ratio: 0.08
  weight_decay: 0.1

  checkpoint_interval: 500
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4174_400M_c4_40B_v4_64_space8_top2_direct_read
log_dir: gs://dawn-tpu-data-c4/logs/dawn_srw_v4174_400M_c4_40B_v4_64_space8_top2_direct_read
