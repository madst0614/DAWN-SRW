seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data
  evict_train_shard_cache: true

model:
  model_version: spatial-r1-v4.1.6.7
  vocab_size: 30522
  d_model: 4096
  n_layers: 24
  n_heads: 32      # head_dim = 128
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true

  d_route: 384
  fixed_tau: true
  layers_per_stage: 3
  router_scope: local

  # Parameter-matched pool target:
  # total operators = 4215 + 13116 + 35223 = 52554
  # expected params ~= baseline - 4093
  n_qk: 4215
  n_v: 13116
  n_rst: 35223

  # GSL 5/10/85-ish split, n_layers=24, stage_count=8
  # qk: 215 + 8*53 + 24*149 = 4215
  n_qk_global: 215
  n_qk_stage: 53
  n_qk_local: 149

  # v: 668 + 8*164 + 24*464 = 13116
  n_v_global: 668
  n_v_stage: 164
  n_v_local: 464

  # rst: 1775 + 8*440 + 24*1247 = 35223
  n_rst_global: 1775
  n_rst_stage: 440
  n_rst_local: 1247

  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_mode: quantile_frac
  tau_init_target_qk_frac: 0.62
  tau_init_target_v_frac: 0.46
  tau_init_target_rst_frac: 0.24

training:
  batch_size: 1024
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_qk: 1
  n_chunks_v: 2
  n_chunks_rst: 4

  lr: 0.0002
  warmup_ratio: 0.06
  weight_decay: 0.1

  tau_lr_mult: 0.0
  tau_grad_clip: 2.0
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  op_key_lr_mult: 1.0
  op_key_grad_clip: 2.0

  diversity_weight: 0.0
  load_balance_weight: 0.0
  dead_penalty_weight: 0.0
  dead_exposure_target: 0.0

  selection_calibration:
    enabled: true

    calibration_tokens: 16777216
    calibration_max_batches: 64
    histogram_bins: 16384
    score_min: -1.0
    score_max: 1.0
    candidate_eps: 1.0e-3

    active_target:
      qk: 0.62
      v: 0.46
      rst: 0.24

    candidate_target_start:
      qk: 0.76
      v: 0.60
      rst: 0.34

    candidate_target_final:
      qk: 0.62
      v: 0.46
      rst: 0.24

    B_floor:
      qk: 0.001
      v: 0.001
      rst: 0.001

    annealing:
      unit: tokens
      shrink_start_tokens: 7500000000
      shrink_end_tokens: 25000000000

  soft_gate_effective_active_eps: 1.0e-06
  admission_den_power: 0.5
  admission_den_grad_scale: 1.0

  soft_gate_boundary_power_start: 3.0
  soft_gate_boundary_power_mid: 3.0
  soft_gate_boundary_power_final: 4.0
  soft_gate_boundary_power_start_frac: 0.0
  soft_gate_boundary_power_mid_frac: 0.360
  soft_gate_boundary_power_final_frac: 1.000

  eval_effective_prune_enabled: true
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001

  checkpoint_interval: 200
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4167_1p3B_c4_40B_v4_64_gsl_5_10_85
