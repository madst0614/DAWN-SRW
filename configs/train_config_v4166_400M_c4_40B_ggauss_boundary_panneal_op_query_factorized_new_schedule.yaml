seed: 1
data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 40000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.6.6
  vocab_size: 30522
  d_model: 2304
  n_layers: 18
  n_heads: 36
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true
  d_route: 256
  n_qk: 2262
  n_v: 11206
  n_rst: 31432
  op_key_stopgrad_rw: false
  op_query_factorized: true
  op_query_factorized_mode: product
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_mode: quantile_frac
  tau_init_target_qk_frac: 0.10
  tau_init_target_v_frac: 0.04
  tau_init_target_rst_frac: 0.02

training:
  restore_training_config_on_resume: true
  batch_size: 1024
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1
  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4
  lr: 0.0003
  warmup_ratio: 0.08
  weight_decay: 0.1
  tau_lr_mult: 0.0
  tau_grad_clip: 2.0
  router_proj_lr_mult: 1.0
  router_proj_grad_clip: 2.0
  op_key_lr_mult: 1.0
  op_key_grad_clip: 2.0

  diversity_weight: 0.0
  load_balance_weight: 0.0
  dead_penalty_weight: 0.0
  dead_exposure_target: 0.0

  selection_calibration:
    enabled: true
    run_on: fresh_init_only

    calibration_tokens: 4194304
    calibration_max_batches: 64
    histogram_bins: 16384
    score_min: -1.0
    score_max: 1.0
    candidate_eps: 1.0e-3

    active_target:
      qk: 0.08
      v: 0.04
      rst: 0.025

    candidate_target_start:
      qk: 0.16
      v: 0.07
      rst: 0.045

    candidate_target_final:
      qk: 0.08
      v: 0.04
      rst: 0.025

    B_floor:
      qk: 0.001
      v: 0.001
      rst: 0.001

    annealing:
      unit: tokens
      shrink_start_tokens: 5000000000
      shrink_end_tokens: 20000000000

  soft_gate_effective_active_eps: 1.0e-06
  admission_den_power: 0.5
  admission_den_grad_scale: 1.0

  soft_gate_boundary_power_start: 3.0
  soft_gate_boundary_power_mid: 3.0
  soft_gate_boundary_power_final: 4.0
  soft_gate_boundary_power_start_frac: 0.0
  soft_gate_boundary_power_mid_frac: 0.360
  soft_gate_boundary_power_final_frac: 1.000

  # Developmental Band Annealing values are intentionally kept unchanged.
  soft_gate_t_qk_schedule: developmental_band
  soft_gate_t_qk_sort: 0.035
  soft_gate_t_qk_band: 0.035
  soft_gate_t_qk_mid: 0.035
  soft_gate_t_qk_late: 0.001
  soft_gate_t_qk_final: 0.001
  soft_gate_t_qk_sort_end_frac: 0.0
  soft_gate_t_qk_band_reach_frac: 0.360
  soft_gate_t_qk_formation_end_frac: 0.360
  soft_gate_t_qk_sharpen_end_frac: 1.000
  soft_gate_t_qk_formation_power: 1.0
  soft_gate_t_qk_sharpen_power: 1.0

  soft_gate_t_v_schedule: developmental_band
  soft_gate_t_v_sort: 0.018
  soft_gate_t_v_band: 0.018
  soft_gate_t_v_mid: 0.018
  soft_gate_t_v_late: 0.001
  soft_gate_t_v_final: 0.001
  soft_gate_t_v_sort_end_frac: 0.0
  soft_gate_t_v_band_reach_frac: 0.360
  soft_gate_t_v_formation_end_frac: 0.360
  soft_gate_t_v_sharpen_end_frac: 1.000
  soft_gate_t_v_formation_power: 1.0
  soft_gate_t_v_sharpen_power: 1.0

  soft_gate_t_rst_schedule: developmental_band
  soft_gate_t_rst_sort: 0.011
  soft_gate_t_rst_band: 0.011
  soft_gate_t_rst_mid: 0.011
  soft_gate_t_rst_late: 0.001
  soft_gate_t_rst_final: 0.001
  soft_gate_t_rst_sort_end_frac: 0.0
  soft_gate_t_rst_band_reach_frac: 0.360
  soft_gate_t_rst_formation_end_frac: 0.360
  soft_gate_t_rst_sharpen_end_frac: 1.000
  soft_gate_t_rst_formation_power: 1.0
  soft_gate_t_rst_sharpen_power: 1.0

  eval_effective_prune_enabled: true
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001
  checkpoint_interval: 200
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4166_400M_c4_40B_ggauss_boundary_panneal_op_query_factorized_new_schedule
