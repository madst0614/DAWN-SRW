seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 20000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.1
  vocab_size: 30522
  d_model: 4096
  n_layers: 24
  n_heads: 32      # head_dim = 128
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true

  d_route: 384
  admission_den_power: 1.0
  n_qk: 7048
  n_v: 21928
  n_rst: 56794

  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_target_qk_frac: 0.20
  tau_init_target_v_frac: 0.10
  tau_init_target_rst_frac: 0.02

training:
  batch_size: 448
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_qk: 1
  n_chunks_v: 2
  n_chunks_rst: 8

  lr: 0.0002
  tau_lr_mult: 0.001
  warmup_ratio: 0.06
  weight_decay: 0.1
  
  eval_effective_prune_enabled: false
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001
    
  checkpoint_interval: 500
  val_interval: 1000
  log_interval: 200
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4171_1p3B_c4_20B_v4_64_emb_tau
