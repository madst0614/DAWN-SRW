# DAWN-SRW v4.1.7.4 canonical 400M production configuration.
#
# Execution topology retained from the accepted exact-backward path:
#   forward: bundle4
#   backward: exact selected-top-2 spaces
#   bucket capacity: 3072 with compact exact overflow
#
# This config uses the fresh operation-space parameter schema:
#   space_selector / space_interface / operator_controller / operator_bank
# and one independent tau map per route and operation space. Earlier v4174
# checkpoints are intentionally incompatible.
#
# Parameter-matched horizontal expansion with fixed D=2048 and R=256:
#   v4172 reference: 393,800,708
#   v4174:           393,803,872
#   difference:          +3,164 (+0.0008%)
#
# Exact equality is not representable while preserving M=24, mesh_model=2,
# Q=K, and whole per-space operator shards: one route changes in multiples of
# 48 operators (24,576 parameters). The closest valid count adds 48 RST
# operators and minimally perturbs the QK:V:RST ratio.
#
# The 40B C4 source remains unchanged; max_train_tokens selects its first 20B
# tokens, yielding 38,146 full global batches at batch=1024 and seq=512.

seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 20000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.4

  vocab_size: 30522
  d_model: 2048
  d_route: 256
  n_layers: 18
  n_heads: 32
  max_seq_len: 512

  dropout: 0.0
  gradient_checkpointing: true

  n_operation_spaces: 24
  operation_space_top_k: 2
  operation_space_execution_mode: bundle_dense
  operation_space_bundle_size: 4
  operation_space_bundle_token_block_size: 2048

  n_q: 21504
  n_k: 21504
  n_v: 134016
  n_rst: 270000

  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_target_qk_frac: 0.08
  tau_init_target_v_frac: 0.08
  tau_init_target_rst_frac: 0.05

  srw_composition_mode: linear_angular
  admission_den_power: 1.0
  admission_den_power_qk: 0.5
  admission_den_power_v: 1.0
  admission_den_power_rst: 1.2

training:
  mesh_data: 16
  mesh_model: 2

  batch_size: 1024
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_q: 1
  n_chunks_k: 1
  n_chunks_v: 2
  n_chunks_rst: 8

  lr: 3.0e-4
  tau_lr_mult: 0.001
  warmup_ratio: 0.08
  weight_decay: 0.1

  checkpoint_interval: 500
  val_interval: 1000
  log_interval: 100
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4174_400M_c4_20B_v4_64
log_dir: gs://dawn-tpu-data-c4/logs/dawn_srw_v4174_400M_c4_20B_v4_64
