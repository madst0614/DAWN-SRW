seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 20000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.7.2
  vocab_size: 30522
  d_model: 4096
  n_layers: 24
  n_heads: 32      # head_dim = 128
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true

  d_route: 256
  srw_composition_mode: linear_angular
  admission_den_power: 1.0
  admission_den_power_qk: 0.5
  admission_den_power_v: 1.0
  admission_den_power_rst: 1.2

  # Total-parameter matched to the official v4171 1.3B config.
  # v4172 source ratio: 4600:14500:29300 (QK:V:RST).
  # Closest mesh/chunk-divisible total is 1,272,038,404 parameters,
  # 4,352 below the v4171 reference total of 1,272,042,756.
  n_qk: 8534
  n_v: 26904
  n_rst: 54352

  tau_init_mode: quantile_frac
  tau_init_min: -0.95
  tau_init_max: 0.95
  tau_init_target_qk_frac: 0.05
  tau_init_target_v_frac: 0.03
  tau_init_target_rst_frac: 0.01

training:
  batch_size: 448
  mesh_model: 2
  mesh_data: 16
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_qk: 1
  n_chunks_v: 2
  n_chunks_rst: 8

  lr: 0.0002
  tau_lr_mult: 0.001
  warmup_ratio: 0.06
  weight_decay: 0.1

  eval_effective_prune_enabled: false
  eval_effective_prune_eps_list:
    - 1.0e-06
    - 1.0e-05
    - 0.0001

  checkpoint_interval: 200
  val_interval: 1000
  log_interval: 200
  log_analysis_multiplier: 1000000
  heavy_geometry_multiplier: 1000000

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/train_config_v4172_1p3B_c4_20B_v4_64_ver1_den_qk0p5_v1p0_rst1p2
