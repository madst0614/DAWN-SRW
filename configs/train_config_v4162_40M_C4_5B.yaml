seed: 1

data:
  bin_train: gs://dawn-tpu-data-c4/c4_train_40B
  bin_val: gs://dawn-tpu-data-c4/c4_val.bin
  max_train_tokens: 5000000000
  max_val_tokens: 10000000
  local_cache_dir: /tmp/data

model:
  model_version: spatial-r1-v4.1.6.2
  vocab_size: 30522
  d_model: 384
  n_layers: 12
  n_heads: 6
  max_seq_len: 512
  dropout: 0.0
  router_dropout: 0.0
  gradient_checkpointing: true

  d_route: 128
  d_select: 64
  n_qk: 1480
  n_v: 7330
  n_rst: 20560

  # v4162 bounded sigmoid tau:
  #   tau = -1 + 2 * sigmoid(raw_tau)
  tau_init_attn_qk: -0.95
  tau_init_attn_v: -0.95
  tau_init_rst: -0.95

training:
  batch_size: 128
  mesh_model: 1
  mesh_data: 4
  gradient_accumulation_steps: 1
  num_epochs: 1

  n_chunks_qk: 1
  n_chunks_v: 1
  n_chunks_rst: 4

  lr: 0.00065
  warmup_ratio: 0.06
  weight_decay: 0.1
  pool_weight_decay: 0.02

  # Keep these explicit zeros because train_jax has nonzero legacy defaults.
  # v4162 clean loss ignores these terms, but explicit zeros keep logs/config
  # unambiguous unless train_jax defaults are also cleaned.
  orthogonality_weight: 0.0
  diversity_weight: 0.0
  load_balance_weight: 0.0
  tau_reg_weight: 0.0

  dead_penalty_weight: 0.005
  dead_exposure_target: 0.1

  soft_gate_enabled: true
  soft_gate_t_start: 1.5
  soft_gate_t_final: 0.07
  soft_gate_t_hold_frac: 0.10
  soft_gate_t_anneal_end_frac: 0.80
  soft_gate_schedule: cosine
  soft_gate_effective_active_eps: 1.0e-6

  tau_ce_grad_scale_start: 1.0
  tau_ce_grad_scale_final: 0.0
  tau_ce_grad_scale_hold_frac: 0.25
  tau_ce_grad_scale_anneal_end_frac: 0.60
  tau_ce_grad_scale_schedule: cosine

  rpe_enabled: true
  rpe_start_frac: 0.20
  rpe_full_frac: 0.45
  rpe_schedule: linear
  exploration_weight: 0.001
  exploration_asymmetry: 3.0
  exploration_lower_bound: -0.5
  exploration_upper_bound: 2.0
  exploration_bound_eps: 0.001
  exploration_dev_mode: raw
  exploration_ce_clip_std: 2.0
  exploration_z_clip: 2.0
  exploration_z_tanh: true

  intensity_beta: 0.5

  effective_prune_eps_list: [1.0e-6, 1.0e-5, 1.0e-4]
  eval_effective_prune_enabled: true
  eval_effective_prune_eps_list: [1.0e-6, 1.0e-5, 1.0e-4]

  checkpoint_interval: 1000
  val_interval: 500
  log_interval: 100
  log_analysis_multiplier: 10
  heavy_geometry_multiplier: 10

  stop_on_collapse: false
  crash_snapshot: false
  crash_snapshot_enabled: false
  spike_event_logger: false

checkpoint_dir: gs://dawn-tpu-data-c4/checkpoints/dawn_srw_v4162_soft_annealed_directtau_40M_c4_5B
log_dir: gs://dawn-tpu-data-c4/logs/dawn_srw_v4162_soft_annealed_directtau_40M_c4_5B
